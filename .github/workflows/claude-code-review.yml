name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - staging

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this Laravel pull request following the project guidelines in AGENTS.md. Focus on:
            - Code quality and Laravel conventions (SOLID, DRY, YAGNI, KISS)
            - Bugs, edge cases, and missing validation or authorization
            - Security: mass assignment, SQL injection, CSRF, XSS, secrets, N+1 queries
            - Performance and database query efficiency
            - Tests: PHPUnit feature tests for behavioral changes, factories over manual data
            - Frontend: Blade and Tailwind consistency

            The PR branch is already checked out in the working directory.
            Use `gh pr diff` and `gh pr view` for context.
            Post a concise summary with `gh pr comment`.
            Use `mcp__github_inline_comment__create_inline_comment` (with confirmed: true) for specific line-level issues.
            Only post GitHub comments; do not output review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
